customHeaders:
  - pattern: '**'
    headers:
      - key: Referrer-Policy
        value: no-referrer
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Cache-Control
        value: no-cache
  - pattern: '/downloads/*.apk'
    headers:
      - key: Content-Type
        value: application/vnd.android.package-archive
      - key: Content-Disposition
        value: attachment
