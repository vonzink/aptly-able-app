name: aptly-able-mobile-dev
# Local development only; production uses deploy/pilot and separate credentials.
services:
  postgres:
    image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    environment:
      POSTGRES_DB: aptly_mobile
      POSTGRES_USER: aptly
      POSTGRES_PASSWORD: aptly_local_only
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aptly -d aptly_mobile']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
